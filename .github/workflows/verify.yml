name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test + dogfood parse + stats
        run: |
          npm test
          npm run dogfood
          npm run stats
          npm run smoke -- --ci
